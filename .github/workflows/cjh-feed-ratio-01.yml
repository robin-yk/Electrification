name: CJH fixed-volume feed-ratio pilot
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: c2co-budgeted-campaign
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r tools/cantera/requirements.txt
      - name: Run gated ratio pilot
        timeout-minutes: 10
        run: python -u tools/openmkm_dynamic/run_cjh_feed_ratio_01.py --refine --output-dir out/cjh-feed-ratio-03
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cjh-feed-ratio-03
          path: out/cjh-feed-ratio-03/
