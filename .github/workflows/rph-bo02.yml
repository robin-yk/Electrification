name: Verify sequential acetylene yield recommendation
on:
  workflow_dispatch:
    inputs:
      round:
        type: choice
        options: ['2', '3']
        default: '3'
permissions:
  contents: read
concurrency:
  group: c2co-budgeted-campaign
  cancel-in-progress: false
jobs:
  calculate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r tools/cantera/requirements.txt
      - run: python tools/openmkm_dynamic/run_rph_bo02.py --stage verify --round '${{ inputs.round }}'
        timeout-minutes: 6
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rph-bo-round-${{ inputs.round }}
          path: |
            docs/research/rph-yield-grid-2026-09-07/bo-0${{ inputs.round }}/
            docs/research/rph-yield-grid-2026-09-07/budget.json
