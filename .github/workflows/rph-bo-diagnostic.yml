name: Diagnose BO periodic output
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: c2co-budgeted-campaign
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r tools/cantera/requirements.txt
      - run: python tools/openmkm_dynamic/diagnose_rph_bo01.py
        timeout-minutes: 6
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rph-bo-tighter-01
          path: |
            docs/research/rph-yield-grid-2026-09-07/bo-01/tighter-01/
            docs/research/rph-yield-grid-2026-09-07/budget.json
