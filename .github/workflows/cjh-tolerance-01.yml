name: CJH explicit integrator tolerance check
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: c2co-budgeted-campaign
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r tools/cantera/requirements.txt
      - run: python -m unittest discover -s tools/openmkm_dynamic -p 'test_*.py'
      - name: Run reserved verification
        timeout-minutes: 10
        run: python -u tools/openmkm_dynamic/run_cjh_tolerance_01.py --output-dir out/cjh-tolerance-01
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cjh-tolerance-01
          path: out/cjh-tolerance-01/
