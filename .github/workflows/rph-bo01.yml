name: Verify acetylene yield BO recommendation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: c2co-budgeted-campaign
  cancel-in-progress: false
jobs:
  calculate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r tools/cantera/requirements.txt
      - run: python tools/openmkm_dynamic/verify_rph_bo01.py
        timeout-minutes: 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rph-bo01
          path: |
            docs/research/rph-yield-grid-2026-09-07/bo-01/verification/
            docs/research/rph-yield-grid-2026-09-07/budget.json
