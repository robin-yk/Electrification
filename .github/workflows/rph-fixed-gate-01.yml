name: RPH fixed-volume entry gate
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: c2co-budgeted-campaign
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r tools/cantera/requirements.txt
      - name: Run entry gate
        timeout-minutes: 4
        run: python tools/openmkm_dynamic/run_rph_fixed_gate.py --output-dir out/rph-fixed-gate-01
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rph-fixed-gate-01
          path: out/rph-fixed-gate-01/
