name: CJH small-volume tolerance diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: c2co-budgeted-campaign
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r tools/cantera/requirements.txt
      - run: python tools/openmkm_dynamic/diagnose_cjh_small_volume.py
        timeout-minutes: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cjh-small-volume-diagnostic
          path: out/cjh-small-volume-diagnostic/
