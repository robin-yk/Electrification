name: RPH fixed-volume periodic pilot
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: c2co-budgeted-campaign
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r tools/cantera/requirements.txt
      - name: Run periodic gates
        timeout-minutes: 10
        run: python tools/openmkm_dynamic/run_rph_fixed_pulse.py --output-dir out/rph-fixed-pulse-02
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rph-fixed-pulse-02
          path: out/rph-fixed-pulse-02/
